nodeLinker: node-modules

# react-native-worklets only needs @react-native/metro-config for its opt-in
# bundle mode. The app bundles through expo/metro-config, so the peer is
# marked optional instead of installing a package nothing loads.
packageExtensions:
  react-native-worklets@*:
    peerDependenciesMeta:
      "@react-native/metro-config":
        optional: true

yarnPath: .yarn/releases/yarn-4.12.0.cjs

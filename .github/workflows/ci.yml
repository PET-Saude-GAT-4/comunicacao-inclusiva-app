name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Expo CLI asks api.expo.dev for SDK metadata on every command; none of
# these checks needs it, and offline mode keeps an Expo outage from failing CI.
env:
  EXPO_OFFLINE: "1"

# One job per check so that a failure names what broke, and so that each can be
# a required status check of its own. The job ids double as the check names in
# branch protection: renaming one means updating the protection too.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn lint

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn format:check

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn test

  bundle:
    name: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Bundles the JavaScript the way a release does, which catches Metro
      # resolution errors that tsc and Jest do not see. The URL is a
      # placeholder: app.config.ts only copies it into the bundle.
      - run: yarn expo export --platform android
        env:
          API_BASE_URL: http://localhost:8080

name: CI

on:
  pull_request:
    branches: [main, develop]
  # Branch protection does not require PRs to be up to date with their base, so
  # two PRs that each pass can still break develop once both are merged. The
  # push run checks the merged code where it lands.
  push:
    branches: [main, develop]

# Only pull request runs cancel each other. Push runs are keyed by commit so
# every merge keeps its own result: a group shared by push runs would drop a
# queued run when a newer one arrives, even with cancel-in-progress off.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The Expo CLI asks api.expo.dev for SDK metadata on every command; none of
# these checks needs it, and offline mode keeps an Expo outage from failing CI.
env:
  EXPO_OFFLINE: "1"

# One job per check so that a failure names what broke, and so that each can be
# a required status check of its own. The job ids double as the check names in
# branch protection: renaming one means updating the protection too.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn lint

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn format:check

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn test

  bundle:
    name: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      # Bundles the JavaScript the way a release does, which catches Metro
      # resolution errors that tsc and Jest do not see. The URL is a
      # placeholder: app.config.ts only copies it into the bundle.
      - run: yarn expo export --platform android
        env:
          API_BASE_URL: http://localhost:8080

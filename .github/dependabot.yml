version: 2
updates:
  # Keeps the SHA pins of the GitHub Actions current. npm dependencies are
  # updated by hand.
  - package-ecosystem: github-actions
    # Dependabot only reads the workflows under "/" and does not look inside
    # composite actions unless their folder is listed.
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: ci
